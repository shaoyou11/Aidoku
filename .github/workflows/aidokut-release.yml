name: AidokuT 上游跟进与内部测试
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  statuses: read
  checks: read
concurrency:
  group: aidokut-custom-release
  cancel-in-progress: false
jobs:
  follow-upstream:
    if: github.repository == 'shaoyou11/Aidoku'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: custom/nas-sync
          fetch-depth: 0
      - name: 合并上游并检查定制保护
        id: source
        run: bash scripts/prepare-upstream-sync.sh
      - name: 推送定制分支并触发 Xcode Cloud
        if: steps.source.outputs.changed == 'true'
        run: git push origin HEAD:custom/nas-sync
      - name: 等待 Xcode Cloud 编译和内部测试流程
        if: steps.source.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: python3 scripts/wait-cloud-check.py
